name: EAS iOS Production Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: false
        default: 'ios'
        type: choice
        options:
          - ios
          - android
          - all

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: 24.8.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Restore iOS signing files
        run: |
          mkdir -p ios-certs
          echo "${{ secrets.IOS_DIST_P12_B64 }}" | base64 -d > ios-certs/dist-legacy.p12
          echo "${{ secrets.IOS_PROVISIONING_PROFILE_B64 }}" | base64 -d > ios-certs/Kamino_App_Store.mobileprovision
          cat > credentials.json <<EOF
          {
            "ios": {
              "provisioningProfilePath": "./ios-certs/Kamino_App_Store.mobileprovision",
              "distributionCertificate": {
                "path": "./ios-certs/dist-legacy.p12",
                "password": "${{ secrets.IOS_DIST_P12_PASSWORD }}"
              }
            }
          }
          EOF
          ls -la ios-certs/

      - name: Submit EAS build
        run: |
          eas build --platform ${{ inputs.platform || 'ios' }} --profile production --non-interactive --no-wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_BUILD_NO_EXPO_GO_WARNING: 'true'
