name: EAS iOS Submit to App Store

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build number to submit (e.g. 21)'
        required: true
        default: '21'
      ipa_url:
        description: 'Direct IPA download URL (Expo artifact link)'
        required: true

jobs:
  submit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Download IPA
        run: |
          curl -sL -o ./kamino-1.0.0-${{ inputs.build_number }}.ipa "${{ inputs.ipa_url }}"
          ls -lh ./*.ipa

      - name: Restore Apple API Key
        run: |
          echo "${{ secrets.EXPO_APPLE_API_KEY }}" | base64 -d > ./AuthKey.p8
          ls -la ./AuthKey.p8

      - name: Submit to App Store Connect
        run: |
          eas submit -p ios --path ./kamino-1.0.0-${{ inputs.build_number }}.ipa --non-interactive --verbose
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
