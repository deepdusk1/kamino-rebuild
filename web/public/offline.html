<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f8f7fc">
    <title>Kamino · You are offline</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f8f7fc;color:#171226;font:16px/1.6 system-ui,sans-serif;padding:24px}main{width:100%;max-width:480px;padding:36px;border:1px solid #e6e0f2;border-radius:28px;background:#fff;box-shadow:0 16px 50px #39216b0d}img{width:64px;height:64px;border-radius:18px}h1{font-size:28px;line-height:1.2;margin:24px 0 16px}p{color:#655b76}a{display:inline-block;margin-top:12px;border-radius:99px;background:#7252cc;padding:12px 24px;color:white;text-decoration:none;font-weight:700}a:focus-visible{outline:3px solid #171226;outline-offset:4px}.note{font-size:13px;margin-top:24px}@media(prefers-color-scheme:dark){body{background:#171226;color:#faf8ff}main{background:#231b33;border-color:#40344f}p{color:#cdc3df}}
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/kamino-192.png" alt="Kamino">
      <h1>You are offline</h1>
      <p>Reconnect to open your communities, posts and chats. Your messages and account details are not saved for offline browsing.</p>
      <a href="/">Try Kamino again</a>
      <p class="note">This screen contains no account or community data.</p>
    </main>
  </body>
